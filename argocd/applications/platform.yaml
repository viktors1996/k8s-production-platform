apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/viktors1996/k8s-production-platform.git
    targetRevision: main
    path: helm/platform
    helm:
      releaseName: platform

  destination:
    server: https://kubernetes.default.svc
    namespace: platform